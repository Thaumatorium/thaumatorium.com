{{ define "main" }}

<article class="article-page">
  <h1>{{ .Title }}</h1>

  <p class="article-page-meta">
    <span>{{ with .Params.Author }}{{ . }}{{ else }}NostraDavid{{ end }}</span>
    <span aria-hidden="true">·</span>
    <time datetime="{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" }}">{{ .PublishDate.Format "2006-01-02" }}</time>
    {{ if and .Lastmod (ne .Lastmod .PublishDate) }}
    <span aria-hidden="true">·</span>
    <span>Updated <time datetime="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Lastmod.Format "2006-01-02" }}</time></span>
    {{ end }}
    <span aria-hidden="true">·</span>
    <span>{{ .WordCount }} words</span>
  </p>

  {{ .Content }}
</article>

<style>
  .article-page-meta {
    color: #6e0000;
    font-family: Tahoma, sans-serif;
    font-size: 0.88em;
    margin-top: -0.5em;
    margin-bottom: 1.5em;
  }
</style>

{{ end }}
