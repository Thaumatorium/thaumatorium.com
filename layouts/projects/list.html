{{ define "main" }}

<h1>{{ .Title }}</h1>

{{ .Content }}

{{ $pages := .Pages }}
{{ if $pages }}
<ul class="project-list">
  {{ range $pages.ByTitle }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Params.description }}
    <span class="project-summary"> — {{ . }}</span>
    {{ end }}
  </li>
  {{ end }}
</ul>
{{ else }}
<p>No projects available yet. Check back soon!</p>
{{ end }}

<style>
  .project-list {
    list-style: disc;
    padding-left: 1.5rem;
    margin-top: 1.5rem;
    margin-bottom: 2rem;
    line-height: 1.5;
  }

  .project-list li + li {
    margin-top: 0.4rem;
  }

  .project-summary {
    color: #555;
  }
</style>

{{ end }}
