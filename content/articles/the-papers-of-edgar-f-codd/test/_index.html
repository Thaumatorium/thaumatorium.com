<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Numbered Headings</title>
		<style>
			/* Initialize a counter */
			body {
				counter-reset: section;
			}

			/* Base styles for headings */
			h1,
			h2,
			h3,
			h4,
			h5,
			h6 {
				position: relative;
				padding-left: 40px; /* Adjust as necessary for spacing */
			}

			/* Pseudo-elements to add numbering */
			.numbered-title::before {
				counter-increment: section;
				content: counter(section) ". ";
				position: absolute;
				left: 0;
				font-weight: bold;
			}

			/* Underlining only the title text */
			.title-text {
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<h1 class="numbered-title"><span class="title-text">Heading 1</span></h1>
		<h2 class="numbered-title"><span class="title-text">Heading 2</span></h2>
		<h3 class="numbered-title"><span class="title-text">Heading 3</span></h3>
		<h4 class="numbered-title"><span class="title-text">Heading 4</span></h4>
		<h5 class="numbered-title"><span class="title-text">Heading 5</span></h5>
		<h6 class="numbered-title"><span class="title-text">Heading 6</span></h6>
		<h1 class="numbered-title"><span class="title-text">Heading 1</span></h1>
		<h2 class="numbered-title"><span class="title-text">Heading 2</span></h2>
		<h3 class="numbered-title"><span class="title-text">Heading 3</span></h3>
		<h4 class="numbered-title"><span class="title-text">Heading 4</span></h4>
		<h5 class="numbered-title"><span class="title-text">Heading 5</span></h5>
		<h6 class="numbered-title"><span class="title-text">Heading 6</span></h6>
		<h1 class="numbered-title"><span class="title-text">Heading 1</span></h1>
		<h2 class="numbered-title"><span class="title-text">Heading 2</span></h2>
		<h3 class="numbered-title"><span class="title-text">Heading 3</span></h3>
		<h4 class="numbered-title"><span class="title-text">Heading 4</span></h4>
		<h5 class="numbered-title"><span class="title-text">Heading 5</span></h5>
		<h6 class="numbered-title"><span class="title-text">Heading 6</span></h6>
	</body>
</html>
