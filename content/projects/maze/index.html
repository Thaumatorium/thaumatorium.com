<section>
	<link rel="stylesheet" href="maze.css">
	<h2>Maze solver</h2>
	<p>Based on <a href="https://github.com/JonPizza/recursive-maze-solver">JonPizza's maze solver</a>, but translated to JS</p>
	<p>
		<select id=selected-maze type=select-one>
			<option value="mazes/maze.png" selected>maze.png</option>
			<option value="mazes/maze2.png">maze2.png</option>
			<option value="mazes/3232maze_original.png">3232maze_original.png</option>
			<option value="mazes/3232maze_long.png">3232maze_long.png</option>
			<option value="mazes/3232maze_longer.png">3232maze_longer.png</option>
			<option value="mazes/3232maze_longest.png">3232maze_longest.png</option>
			<option value="mazes/3232maze_longer_bigger.png">3232maze_longer_bigger.png</option>
		</select>
		<select id=maze-scale type=select-one>
			<option value=1>1</option>
			<option value=2>2</option>
			<option value=3>3</option>
			<option value=4>4</option>
			<option value=5>5</option>
			<option value=6>6</option>
			<option value=7>7</option>
			<option value=8>8</option>
			<option value=9>9</option>
			<option value=10 selected>10</option>
		</select>
		<select id=search-strategy type=select-one>
			<option value="bfs" selected>Breadth-first search</option>
			<option value="dfs">Depth-first search</option>
		</select>
		<label for=animation-speed>
			Speed
			<input id=animation-speed type=range min=1 max=100 value=35>
			<output id=animation-speed-value for=animation-speed>35</output>
		</label>

		<button id=play-animation>Play animation</button>
	</p>
	<canvas id=maze></canvas>
	<script type=module src="maze.mjs"></script>
</section>
