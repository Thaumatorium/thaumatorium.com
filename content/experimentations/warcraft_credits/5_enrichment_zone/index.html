<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Credits Graph Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Game Credits Graph Visualizer</h1>

    <div class="controls">
        <div>
            <label for="fileSelect1">Select Game 1:</label>
            <select id="fileSelect1" aria-label="Select first game file"></select>
        </div>
        <div>
            <label for="fileSelect2">Select Game 2:</label>
            <select id="fileSelect2" aria-label="Select second game file"></select>
        </div>
    </div>

    <div id="loadingMessage" class="status-message" style="display: none;" aria-live="polite">Loading and processing data...</div>
    <div id="errorMessage" class="status-message error-message" aria-live="assertive"></div>

    <!-- Container for the Cytoscape graph -->
    <div id="cy" aria-label="Graph visualization area"></div>

    <!-- Tooltip element (initially hidden) -->
    <div id="tooltip" role="tooltip" aria-hidden="true"></div>

    <!-- External Libraries -->
    <!-- 1. Cytoscape Core (defer ensures it loads after HTML parsing) -->
    <script src="https://unpkg.com/cytoscape@3.31.2/dist/cytoscape.min.js"></script>

    <!-- 2. Layout Dependencies (MUST load AFTER Cytoscape Core, BEFORE layout extension) -->
    <!--    Using `defer` maintains relative order while allowing parallel download -->
    <script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
    <script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>

    <!-- 3. Cytoscape Layout Extension (defer, loads after its dependencies) -->
    <script src="https://unpkg.com/cytoscape-cose-bilkent@4.1.0/cytoscape-cose-bilkent.js" defer></script>

    <!-- 4. Application Logic (type="module" implies defer, loads last) -->
    <script type="module" src="main.js" defer></script>

</body>

</html>
