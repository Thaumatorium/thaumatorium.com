# Prettier configuration file
# This configuration is designed to use tabs for indentation where possible
# and includes a broad range of settings for various languages and file types.

# Specify the line length. Prettier will wrap lines longer than this.
printWidth: 999

# Use tabs instead of spaces for indentation.
useTabs: true

# Specify the number of spaces per indentation-level.
tabWidth: 4

# Include semicolons at the end of statements.
semi: true

# Use single quotes instead of double quotes where applicable.
singleQuote: false

# More specific settings for JavaScript and TypeScript:
overrides:
  - files: "*.js, *.jsx, *.ts, *.tsx"
    options:
      # Use single quotes instead of double quotes in JSX.
      jsxSingleQuote: false

      # Specify how Prettier formats object properties.
      # "as-needed" means only add quotes around object properties where required.
      quoteProps: "as-needed"

      # Define how Prettier formats arrow function parentheses.
      # "always" means always include parentheses around arrow function arguments.
      arrowParens: "always"

# Settings for HTML, Vue, Angular:
  - files: "*.html, *.vue, *.angular"
    options:
      # Specify the number of spaces per indentation-level for HTML.
      useTabs: true

      # Configure how Prettier formats HTML whitespace.
      htmlWhitespaceSensitivity: "strict"

# CSS, SCSS, and Less configuration:
  - files: "*.css, *.scss, *.less"
    options:
      # Specify the number of spaces per indentation-level for CSS.
      tabWidth: 2

# Markdown files configuration:
  - files: "*.md"
    options:
      # Adjust prose wrapping in markdown files.
      proseWrap: "always"

      # Define the number of spaces for markdown files, usually smaller for readability.
      tabWidth: 2

# YAML configuration:
  - files: "*.yaml, *.yml"
    options:
      # Specify the number of spaces per indentation-level for YAML.
      tabWidth: 2

# JSON, JSON5 configuration:
  - files: "*.json, *.json5"
    options:
      # JSON typically uses 2 spaces for indentation for better readability.
      tabWidth: 2

# Use trailing commas where valid in JSON-like formats (JavaScript, TypeScript, JSON).
trailingComma: "es5"

# Ensure newline at the end of files.
endOfLine: "lf"

# Controls the printing of spaces inside object literals.
bracketSpacing: true
